build: false

environment:
  MAMBA_ROOT_PREFIX: C:\micromamba
  matrix:
    - PYTHON_VERSION: 3.7
    - PYTHON_VERSION: 3.8
    - PYTHON_VERSION: 3.9
    - PYTHON_VERSION: "3.10"
    - PYTHON_VERSION: 3.11

init:
  - ECHO %PYTHON_VERSION%

install:
  - ps: Invoke-WebRequest -Uri "https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64.exe" -OutFile "C:\Windows\micromamba.exe"
  - micromamba --version
  - micromamba create -q -y -n test-environment --channel=conda-forge mmtf-python numpy scipy pandas pytest looseversion importlib_resources python=%PYTHON_VERSION%

test_script:
  - micromamba run -n test-environment pytest -s -v
